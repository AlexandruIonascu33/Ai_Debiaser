<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 440px;">
        <section class="bg-white border p-4 shadow-sm">
            <h1 class="h4 mb-3">Administrator Access</h1>
            <form id="adminLoginForm">
                <label class="form-label" for="adminKey">Admin key</label>
                <input class="form-control" id="adminKey" type="password" autocomplete="current-password" required>
                <p class="text-danger small mt-2 mb-0" id="loginError" role="alert"></p>
                <button class="btn btn-primary w-100 mt-3" type="submit">Open dashboard</button>
            </form>
        </section>
    </main>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const error = document.getElementById('loginError');
            error.textContent = '';
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({admin_key: document.getElementById('adminKey').value})
            });
            if (response.ok) {
                window.location.assign('/admin_panel');
                return;
            }
            error.textContent = (await response.json()).message || 'Unable to open the dashboard.';
        });
    </script>
</body>
</html>
